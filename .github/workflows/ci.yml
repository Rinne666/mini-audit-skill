name: ci

# The v1.1 review found that SKILL.md/README claimed "CI runs …" while no
# workflow existed. This is that workflow: it is the executable form of the
# repo's own verification commands, so the claims in the docs are checkable
# rather than aspirational.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # README advertises "Python 3.9+, stdlib-only" — hold it to that at
        # both ends of the supported range.
        python-version: ["3.9", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install test runner
        run: |
          python -m pip install --upgrade pip
          python -m pip install "pytest>=8,<9"

      - name: Unit + hardening tests
        # `-rs` so a skip is never silent: the live-container tests skip here
        # when no sandbox image is staged, and that reason has to be visible
        # rather than hidden behind a green tick.
        run: python -m pytest tests/unit -q -rs

      - name: Manifest integrity (references/MANIFEST.json ↔ disk)
        run: |
          python scripts/manifest.py --check
          python scripts/check-manifest.py --strict

      - name: Doc counts are not stale
        run: python scripts/doc_counts.py --check

      - name: Eval corpus self-check
        run: python evals/run.py --self-check

      - name: Shell scripts parse
        run: |
          status=0
          for f in scripts/*.sh; do
            bash -n "$f" || status=1
          done
          exit $status

      - name: Python sources compile
        run: python -m compileall -q runtime scripts evals tests

      - name: Runtime exposes its version
        run: python scripts/mini-audit-runtime --version

  sandbox-containment:
    name: sandbox containment (live docker)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install test runner
        run: |
          python -m pip install --upgrade pip
          python -m pip install "pytest>=8,<9"

      # DockerBackend deliberately refuses to pull (a verification that only
      # sometimes runs is worse than none), so the image must be staged first
      # or the live containment tests self-skip and prove nothing.
      - name: Stage a sandbox image
        run: docker pull alpine:3.20

      - name: Live containment tests
        env:
          MINI_AUDIT_DOCKER_IMAGE: alpine:3.20
        run: |
          python -m pytest \
            tests/unit/test_sandbox_backend.py \
            tests/unit/test_sandbox.py \
            -q -rs
